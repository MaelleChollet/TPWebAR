<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #retourMenu {
        position: fixed; top: 10px; left: 10px; z-index: 1000;
        padding: 8px 14px; background: #1e1e2f; color: white;
        border: none; border-radius: 6px; font-family: Arial, sans-serif;
        text-decoration: none; display: inline-block;
      }
    </style>
  </head>
  <body>
    <a id="retourMenu" href="index.html">← Menu</a>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false">
       <a-marker preset="hiro"> 
        <a-box position="0 0 0" color="blue" material="opacity: 0.5; transparent: true" animation="property: rotation; to:0 360 0; loop: true; dur: 3000; easing: linear"></a-box>
       </a-marker>
    </a-scene>
  </body>
</html>
